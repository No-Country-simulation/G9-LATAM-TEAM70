spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/TechMind_db?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:techmind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ml:
  service:
    enabled: true
    url: http://ml-service:5000
