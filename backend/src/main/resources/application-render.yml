spring:
  datasource:
    url: jdbc:h2:mem:techmind;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

ml:
  service:
    enabled: true
    url: ${ML_SERVICE_URL:http://localhost:5000}

techmind:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
