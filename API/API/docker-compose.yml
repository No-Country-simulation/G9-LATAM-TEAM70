services:
  techmind-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - MODEL_PATH=/app/models/modelo.pkl
      - VECTORIZER_PATH=/app/models/vectorizer.pkl
      - PYTHON_SCRIPT_PATH=/app/python/predict.py
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./models:/app/models:ro
      - ./src/main/python:/app/python:ro
    depends_on:
      - mysql-db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/contenido/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - techmind-network

  # Nuevo servicio de Base de Datos MySQL
  mysql-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: TechMind_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - techmind-network

  # Servicio para entrenar modelo (ejecutar manualmente)
  model-trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    volumes:
      - ./models:/app/models
      - ./src/main/python:/app/python
    command: python /app/python/train_model.py
    profiles:
      - training
    networks:
      - techmind-network

networks:
  techmind-network:
    driver: bridge

volumes:
  models-data:
  mysql-data: