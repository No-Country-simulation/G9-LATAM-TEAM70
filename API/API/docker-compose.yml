services:
  # Servicio de Machine Learning (servidor HTTP Python/FastAPI)
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=/app/models/modelo.pkl
      - VECTORIZER_PATH=/app/models/vectorizer.pkl
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - techmind-network

  # Aplicacion TechMind de Spring Boot
  techmind-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - ML_SERVICE_ENABLED=true
      - ML_SERVICE_URL=http://ml-service:5000
      - JWT_SECRET=${JWT_SECRET:-techmind-secret-key-2024-very-long-secret-key-for-hs256}
      - TZ=America/Mexico_City
    depends_on:
      - mysql-db
      - ml-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/contenido/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - techmind-network

  # Base de Datos MySQL
  mysql-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: TechMind_db
      TZ: America/Mexico_City
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - techmind-network

  # Una sola vez: entrena y genera los .pkl (perfil batch)
  # Uso: docker compose --profile training run --rm model-trainer
  model-trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    volumes:
      - ./models:/app/models
    profiles:
      - training
    networks:
      - techmind-network

networks:
  techmind-network:
    driver: bridge

volumes:
  mysql-data: