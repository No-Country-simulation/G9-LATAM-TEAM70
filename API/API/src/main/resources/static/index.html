<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMind</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>TechMind</h1>
  <p>Organiza contenido técnico y obtén una categoría con palabras clave.</p>

  <form id="content-form">
    <label for="title">Título</label>
    <input id="title" name="title" maxlength="255" required placeholder="Ej. Introducción a Spring Boot">

    <label for="content">Contenido</label>
    <textarea id="content" name="content" maxlength="10000" required placeholder="Describe el contenido técnico que quieres organizar."></textarea>

    <button id="submit" type="submit">
        <span class="btn-content">
          <svg id="loading-spinner" class="spinner-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
            <path fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-dasharray="300 385" stroke-dashoffset="0" d="M275 75c0 31-27 50-50 50-58 0-92-100-150-100-28 0-50 22-50 50s23 50 50 50c58 0 92-100 150-100 24 0 50 19 50 50Z">
              <animate attributeName="stroke-dashoffset" calcMode="spline" dur="2" values="685;-685" keySplines="0 0 1 1" repeatCount="indefinite"></animate>
            </path>
          </svg>
          <span id="btn-text">Procesar contenido</span>
        </span>
    </button>
  </form>

  <section id="result" aria-live="polite"></section>

  <p class="links">
    <a href="swagger-ui.html" target="_blank">Abrir documentación Swagger</a> ·
    <a href="contenido/health" target="_blank">Comprobar estado de la API</a>
  </p>
</main>

<!-- script de modulo debe estar antes de cerrar el body -->
<script type="module" src="js/app.js"></script>
</body>
</html>
