spring:
  application:
    name: techmind-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/TechMind_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api
  shutdown: graceful

logging:
  level:
    com.team70: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Python ML Service Configuration (external service)
ml:
  service:
    enabled: ${ML_SERVICE_ENABLED:false}
    url: ${ML_SERVICE_URL:http://localhost:5000}
    timeout: ${ML_TIMEOUT:30000}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:techmind-secret-key-2024-very-long-secret-key-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}
